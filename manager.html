<style>
:root{--bg:#fff;--fg:#111;--mute:#5c5c57;--line:#e6e4df;--tone:#efece6;--ok:#2f6b3a;--warn:#9a5b00;--bad:#a12a2a}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:300 15px/1.5 Inter,Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg);padding:20px 16px 64px;max-width:860px;margin:0 auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:32px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--fg);padding:10px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
button.fill{background:var(--fg);color:#fff}button:disabled{opacity:.4;cursor:default}
input,textarea{border:1px solid var(--line);padding:10px;width:100%;background:#fff}
label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
a{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:18px 0 6px;overflow-x:auto}
.tabs button{border:0;padding:10px 0;font-size:11px;letter-spacing:.12em;white-space:nowrap}.tabs button.on{border-bottom:1px solid var(--fg)}
.tabs b{font-weight:500;margin-left:4px}
.o{border:1px solid var(--line);padding:16px;margin-top:14px;display:grid;gap:12px}
.oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.oh b{font-weight:500;font-size:16px}
.st{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor}
.st.new{color:var(--bad)}.st.packed{color:var(--warn)}.st.shipped,.st.delivered{color:var(--ok)}.st.cancelled,.st.pending{color:var(--mute)}
.blk{background:var(--tone);padding:12px;display:grid;gap:4px}
.blk .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.its div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.its div:last-child{border:0}
.big{font-size:17px;font-weight:400}
.form{display:grid;gap:12px;max-width:420px;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 18px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
.sect{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--fg);margin-top:14px}
.sect button{border:0;padding:12px 8px;font-size:12px}.sect button.on{background:var(--fg);color:#fff}
select{font:inherit;color:inherit;border:1px solid var(--line);padding:10px;width:100%;background:#fff}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item img{width:72px;height:96px;object-fit:cover;background:var(--tone)}
.item .nm{font-weight:400}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--fg);padding:6px 12px;font-size:13px;text-transform:none;letter-spacing:0}.chip.off{background:var(--tone);color:var(--mute);border-color:var(--line);text-decoration:line-through}
.badge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);margin-left:6px;color:var(--mute)}
.out{color:var(--bad);font-weight:400}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs span{position:relative}.thumbs img{width:72px;height:96px;object-fit:cover}.thumbs b{position:absolute;top:2px;right:2px;background:#fff;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-weight:400}

</style></head><body>
<h1>Управление магазином</h1>
<div id="login" class="form"><label>Пароль<input id="pw" type="password" autocomplete="current-password"></label><div><button class="fill" id="enter">Войти</button></div></div>
<div id="main" hidden>
<div class="row no-print" style="justify-content:space-between;margin-top:6px"><span class="muted" id="who"></span><span class="row"><button id="rf">Обновить</button><button id="out">Выйти</button></span></div>
<div class="sect no-print"><button data-s="orders" class="on">Заказы</button><button data-s="goods">Товары и наличие</button></div>
<section id="s-orders">
<div class="tabs no-print" id="tabs"></div>
<div id="list"></div>
</section>
<section id="s-goods" class="no-print" hidden>
<p class="muted" id="g-status" style="margin-top:14px"></p>
<div class="tabs" id="g-tabs"><button data-g="items" class="on">Товары</button><button data-g="add">Добавить товар</button><button data-g="log">Журнал</button></div>
<div id="g-items"><div class="row" style="margin:12px 0"><input id="g-q" placeholder="Поиск: название или код" style="flex:1;min-width:200px"><button id="g-sync">Синхронизировать с Instagram</button></div>
<p class="muted">«В наличии / Нет в наличии» — весь товар. Нажатие на размер зачёркивает его (размера нет), повторное — возвращает. «Авто» — снова брать наличие из Instagram.</p><div id="g-list"></div></div>
<div id="g-add" hidden><div class="gform">
<p class="big" id="f-title">Новый товар</p>
<label>Название<input id="f-name" maxlength="90"></label>
<label>Цена, ₽<input id="f-price" type="number" min="1" step="1" inputmode="numeric"></label>
<label>Раздел<select id="f-cat"><option value="">—</option><option value="platya">Платья</option><option value="yubki">Юбки</option><option value="kostyumy">Костюмы / комплекты</option><option value="kardigany">Кардиганы</option><option value="svitery">Свитеры и джемперы</option></select></label>
<label>Размеры через запятую (пусто — единый размер)<input id="f-sizes" placeholder="XS/S, M"></label>
<label>Описание<textarea id="f-desc" rows="3" maxlength="300"></textarea></label>
<label class="row" style="color:var(--fg)"><input id="f-new" type="checkbox" style="width:auto" checked> Отметить как новинку</label>
<label>Фото (до 8, первое — обложка)<input id="f-photos" type="file" accept="image/*" multiple></label>
<div class="thumbs" id="f-thumbs"></div>
<div class="row"><button class="fill" id="f-save">Сохранить товар</button><button id="f-cancel" hidden>Отмена</button></div></div></div>
<div id="g-log" hidden></div>
</section>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="on")e.onclick=v;else if(x==="cls")e.className=v;else e.setAttribute(x,v)}for(const c of k)if(c!=null&&c!==false)e.append(c);return e};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2400)};
const rub=n=>Number(n||0).toLocaleString("ru-RU")+" ₽";
const dt=d=>d?new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"";
const ST={new:"Собрать",packed:"Собран, ждёт отправки",shipped:"Отправлен",delivered:"Получен",cancelled:"Отменён",pending:"Не оплачен"};
// Вкладки: что отправить, что уже в пути, завершённые, неоплаченные (на случай звонка покупателя)
const TABS=[["todo","К отправке",o=>o.paid==="paid"&&["new","packed"].includes(o.ship.status)],["way","В пути",o=>o.paid==="paid"&&o.ship.status==="shipped"],["done","Завершённые",o=>["delivered","cancelled"].includes(o.ship.status)||o.paid==="refunded"],["unpaid","Не оплачены",o=>!["paid","refunded"].includes(o.paid)&&o.ship.status!=="cancelled"]];
let KEY="",TAB="todo",L=[];try{KEY=localStorage.getItem("gn_mgr")||""}catch(e){}
async function call(action,data={}){const r=await fetch("/api/manager",{method:"POST",headers:{"Content-Type":"application/json","x-manager-key":KEY},body:JSON.stringify({action,...data})});
const d=await r.json().catch(()=>({error:"Ошибка сервера"}));if(r.status===401){out();throw new Error(d.error)}if(!r.ok)throw new Error(d.error||"Ошибка");return d}
function out(){KEY="";try{localStorage.removeItem("gn_mgr")}catch(e){}$("#main").hidden=true;$("#login").hidden=false}
async function load(){const d=await call("list");L=d.orders;$("#who").textContent="Вы вошли: "+d.by;$("#login").hidden=true;$("#main").hidden=false;render()}
function stOf(o){return o.paid==="paid"||o.ship.status!=="new"?o.ship.status:"pending"}
function where(o){if(o.delivery==="cdek_door")return["Курьер СДЭК до двери",o.city+", "+(o.address||"")];
return[(o.delivery==="cdek_postamat"?"Постамат СДЭК":"Пункт выдачи СДЭК")+(o.pvz?" · код "+o.pvz:""),(o.city||"")+(o.address?", "+o.address:"")]}
function card(o){const st=stOf(o),[dl,ad]=where(o),goods=o.items.filter(i=>i.id!=="delivery"),dlv=o.items.find(i=>i.id==="delivery");
const tr=el("input",{placeholder:"Трек-номер СДЭК",inputmode:"numeric",value:o.ship.track||""});
const nt=el("textarea",{rows:"2",placeholder:"Заметка (видна только вам и администратору)"});nt.value=o.ship.note||"";
const set=(status,btn)=>{btn.disabled=true;call("ship",{id:o.id,status,track:tr.value,note:nt.value}).then(d=>{Object.assign(o,d.order);toast(ST[d.order.ship.status]);render()}).catch(e=>toast(e.message)).finally(()=>btn.disabled=false)};
const acts=el("div",{cls:"row no-print"});const B=(t,s,f)=>{const b=el("button",{cls:f?"fill":""},t);b.onclick=()=>set(s,b);acts.append(b)};
if(o.paid==="paid"){if(o.ship.status==="new")B("Собран","packed",1);if(["new","packed"].includes(o.ship.status))B("Отправлен","shipped",o.ship.status==="packed");
if(o.ship.status==="shipped")B("Получен","delivered",1);if(["packed","shipped","delivered","cancelled"].includes(o.ship.status))B("Вернуть в «К отправке»","new")}
if(o.ship.status!=="cancelled"&&o.ship.status!=="delivered")B("Отменить","cancelled");
const sv=el("button",{},"Сохранить трек и заметку");sv.onclick=()=>set(o.ship.status,sv);acts.append(sv);
const pr=el("button",{},"Печать");pr.onclick=()=>{document.querySelectorAll(".o").forEach(x=>x.classList.remove("pr"));box.classList.add("pr");print()};acts.append(pr);
const box=el("div",{cls:"o"},
el("div",{cls:"oh"},el("b",{},"Заказ "+o.id),el("span",{cls:"st "+st},ST[st])),
el("div",{cls:"muted"},"Оформлен "+dt(o.created)+(o.paidAt?" · оплачен "+dt(o.paidAt):"")+(o.payMethod==="split"?" · Яндекс Сплит":o.paid==="paid"?" · Точка":"")),
el("div",{cls:"blk its"},el("span",{cls:"k"},"Что положить"),...goods.map(i=>el("div",{},el("span",{cls:"big"},i.name),el("span",{},"× "+i.q)))),
el("div",{cls:"blk"},el("span",{cls:"k"},"Кому"),el("span",{cls:"big"},o.name),el("span",{},el("a",{href:"tel:"+o.phone},o.phone)," · ",el("a",{href:"mailto:"+o.email},o.email))),
el("div",{cls:"blk"},el("span",{cls:"k"},"Куда · "+(o.tariff||"СДЭК")),el("span",{cls:"big"},dl),el("span",{},ad)),
el("div",{cls:"muted"},"Товары "+rub(o.total-(dlv?dlv.price:0))+" + доставка "+rub(dlv?dlv.price:0)+" = "+rub(o.total)),
o.paid==="paid"?el("div",{cls:"no-print",style:"display:grid;gap:8px"},tr,nt):null,
o.ship.track?el("div",{},"Трек: ",el("a",{href:"https://www.cdek.ru/ru/tracking?order_id="+encodeURIComponent(o.ship.track),target:"_blank",rel:"noopener"},o.ship.track)):null,
o.ship.by?el("div",{cls:"muted"},"Последнее изменение: "+o.ship.by+", "+dt(o.ship.at)):null,acts);
return box}
function render(){$("#tabs").replaceChildren(...TABS.map(([k,t,f])=>{const n=L.filter(f).length,b=el("button",{cls:k===TAB?"on":""},t,n?el("b",{},n):"");b.onclick=()=>{TAB=k;render()};return b}));
const f=TABS.find(t=>t[0]===TAB)[2],l=L.filter(f);if(TAB==="todo")l.reverse();
$("#list").replaceChildren(...(l.length?l.map(card):[el("p",{cls:"muted",style:"margin-top:20px"},TAB==="todo"?"Всё отправлено. Новые оплаченные заказы появятся здесь.":"Пусто")]))}

// ---------- Товары и наличие (через /api/admin, тот же пароль) ----------
let G=null,GTAB="items",photos=[],editId=null;
async function gcall(action,data={}){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:JSON.stringify({action,...data})});
const d=await r.json().catch(()=>({error:"Ошибка сервера"}));if(r.status===401){out();throw new Error(d.error)}if(!r.ok)throw new Error(d.error||"Ошибка");return d}
const gsave=(p,msg)=>p.then(d=>{G=d;grender();if(msg)toast(msg)}).catch(e=>toast(e.message));
function stockOf(id){const m=G.manual[id]||{},g=G.ig[id]||{};return{out:m.out??g.out??false,sizesOut:m.sizesOut??g.sizesOut??[],manual:!!G.manual[id]}}
const thumbOf=p=>{const u=(p.imgs||[])[0]||"";return /^photos\/[\w-]+\.jpg$/.test(u)?u.replace(/^photos\/(.+)\.jpg$/,"photos/s/$1.webp"):u};
function gload(){return gcall("state").then(d=>{G=d;grender()})}
function grender(){if(!G)return;
$("#g-status").textContent=(G.igConfigured?"Instagram подключён":"Instagram не подключён")+" · последняя синхронизация: "+(G.lastSync?dt(G.lastSync):"ещё не было");
const q=$("#g-q").value.trim().toLowerCase();
const list=[...G.products.map(p=>({...p,dyn:true})),...G.static.map(p=>({...p,imgs:["photos/s/"+p.id+"-1.webp"]}))].filter(p=>!q||(p.name+" "+p.id).toLowerCase().includes(q));
$("#g-list").replaceChildren(...list.map(p=>{const st=stockOf(p.id);
const chips=el("div",{cls:"chips"},...p.sizes.map(sz=>{const b=el("button",{cls:"chip"+(st.sizesOut.includes(sz)?" off":"")},sz);b.onclick=()=>{const so=st.sizesOut.includes(sz)?st.sizesOut.filter(x=>x!==sz):[...st.sizesOut,sz];gsave(gcall("stock",{id:p.id,out:st.out,sizesOut:so}),"Сохранено")};return b}));
const acts=el("div",{cls:"row"});
const ob=el("button",{cls:st.out?"fill":""},st.out?"Нет в наличии":"В наличии");ob.onclick=()=>gsave(gcall("stock",{id:p.id,out:!st.out,sizesOut:st.sizesOut}),st.out?"Снова в наличии":"Отмечено: нет в наличии");acts.append(ob);
if(st.manual){const b=el("button",{},"Авто");b.onclick=()=>gsave(gcall("stock",{id:p.id,reset:true}),"Наличие снова из Instagram");acts.append(b)}
if(p.dyn){const e=el("button",{},"Изменить");e.onclick=()=>edit(p);acts.append(e);
const h=el("button",{},p.hidden?"Показать на сайте":"Скрыть");h.onclick=()=>gsave(gcall("hide",{id:p.id,hidden:!p.hidden}),p.hidden?"Товар снова на сайте":"Товар скрыт");acts.append(h)}
return el("div",{cls:"item"},el("img",{src:thumbOf(p),alt:"",loading:"lazy"}),el("div",{},
el("div",{cls:"nm"},p.name,p.dyn?el("span",{cls:"badge"},p.source==="instagram"?"Instagram":"добавлен вручную"):null,p.hidden?el("span",{cls:"badge"},"скрыт"):null,st.manual?el("span",{cls:"badge"},"наличие вручную"):null),
el("div",{cls:"muted"},Number(p.price).toLocaleString("ru-RU")+" ₽ · код: "+p.id,st.out?el("span",{cls:"out"}," · нет в наличии"):null),chips,acts))}));
if(!list.length)$("#g-list").append(el("p",{cls:"muted"},"Ничего не найдено"));
$("#g-log").replaceChildren(...(G.log.length?G.log.map(l=>el("p",{cls:"muted",style:"padding:6px 0;border-bottom:1px solid var(--line)"},dt(l.at)+" — "+l.text)):[el("p",{cls:"muted"},"Пока пусто")]))}
function gtab(t){GTAB=t;document.querySelectorAll("#g-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.g===t));for(const x of["items","add","log"])$("#g-"+x).hidden=x!==t}
document.querySelectorAll("#g-tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.g==="add"&&editId)resetForm();gtab(b.dataset.g)});
$("#g-q").oninput=grender;
$("#g-sync").onclick=async e=>{e.target.disabled=true;try{G=await gcall("sync");grender();toast(G.log[0]?G.log[0].text:"Готово")}catch(err){toast(err.message)}e.target.disabled=false};
function thumbs(){$("#f-thumbs").replaceChildren(...photos.map((u,i)=>{const x=el("b",{title:"Убрать"},"×");x.onclick=()=>{photos.splice(i,1);thumbs()};return el("span",{},el("img",{src:u,alt:""}),x)}))}
function resetForm(){editId=null;photos=[];["#f-name","#f-price","#f-sizes","#f-desc","#f-photos"].forEach(s=>$(s).value="");$("#f-cat").value="";$("#f-new").checked=true;$("#f-title").textContent="Новый товар";$("#f-cancel").hidden=true;thumbs()}
function edit(p){editId=p.id;$("#f-title").textContent="Изменить: "+p.name;$("#f-name").value=p.name;$("#f-price").value=p.price;$("#f-cat").value=(p.cats||[])[0]||"";
$("#f-sizes").value=p.sizes.join(", ")==="единый размер"?"":p.sizes.join(", ");$("#f-desc").value=p.desc||"";$("#f-new").checked=!!p.isNew;photos=[...(p.imgs||[])];$("#f-cancel").hidden=false;thumbs();gtab("add");scrollTo(0,0)}
$("#f-cancel").onclick=()=>{resetForm();gtab("items")};
async function shrink(file){const img=await createImageBitmap(file);const k=Math.min(1,1440/Math.max(img.width,img.height));
const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
return c.toDataURL("image/jpeg",.85).split(",")[1]}
$("#f-photos").onchange=async e=>{const files=[...e.target.files].slice(0,8-photos.length);if(!files.length)return toast("Не больше 8 фото");toast("Загружаем фото…");
for(const f of files){try{const d=await gcall("upload",{data:await shrink(f)});photos.push(d.url);thumbs()}catch(err){toast(err.message)}}e.target.value=""};
$("#f-save").onclick=async e=>{const sizes=$("#f-sizes").value.split(",").map(s=>s.trim()).filter(Boolean);e.target.disabled=true;
try{G=await gcall("product",{id:editId||undefined,name:$("#f-name").value,price:$("#f-price").value,cats:$("#f-cat").value?[$("#f-cat").value]:[],sizes,desc:$("#f-desc").value,isNew:$("#f-new").checked,imgs:photos});
toast(editId?"Изменения сохранены":"Товар добавлен на сайт");resetForm();grender();gtab("items")}catch(err){toast(err.message)}e.target.disabled=false};
let SECT="orders";try{SECT=localStorage.getItem("gn_mgr_s")||"orders"}catch(e){}
function sect(s){SECT=s;try{localStorage.setItem("gn_mgr_s",s)}catch(e){}document.querySelectorAll(".sect button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));$("#s-orders").hidden=s!=="orders";$("#s-goods").hidden=s!=="goods";if(s==="goods")gload().catch(e=>toast(e.message))}
document.querySelectorAll(".sect button").forEach(b=>b.onclick=()=>sect(b.dataset.s));
$("#enter").onclick=()=>{KEY=$("#pw").value;try{localStorage.setItem("gn_mgr",KEY)}catch(e){}load().then(()=>sect(SECT)).catch(e=>toast(e.message))};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#enter").click()};
$("#out").onclick=out;$("#rf").onclick=()=>(SECT==="goods"?gload():load()).then(()=>toast("Обновлено")).catch(e=>toast(e.message));
if(KEY)load().then(()=>sect(SECT)).catch(()=>{});
setInterval(()=>{if(KEY&&SECT==="orders"&&!document.hidden&&!document.activeElement.matches("input,textarea"))load().catch(()=>{})},60000);
</script></body></html>
