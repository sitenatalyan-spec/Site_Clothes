<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Заказы к отправке — Gluhova Natalya</title>
<style>@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/cormorant-cyrillic-4f4a82.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; } @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/cormorant-latin-2fed1d.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; } @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/cormorant-cyrillic-4f4a82.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; } @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/cormorant-latin-2fed1d.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; } @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; font-display: swap; src: url(fonts/inter-cyrillic-4ee8fc.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; } @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; font-display: swap; src: url(fonts/inter-latin-567244.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; } @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/inter-cyrillic-4ee8fc.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; } @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-567244.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; } @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/inter-cyrillic-4ee8fc.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; } @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-567244.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }</style>
<style>
:root{--bg:#fff;--fg:#111;--mute:#5c5c57;--line:#e6e4df;--tone:#efece6;--ok:#2f6b3a;--warn:#9a5b00;--bad:#a12a2a}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:300 15px/1.5 Inter,Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg);padding:20px 16px 64px;max-width:860px;margin:0 auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:32px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--fg);padding:10px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
button.fill{background:var(--fg);color:#fff}button:disabled{opacity:.4;cursor:default}
input,textarea{border:1px solid var(--line);padding:10px;width:100%;background:#fff}
label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
a{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:18px 0 6px;overflow-x:auto}
.tabs button{border:0;padding:10px 0;font-size:11px;letter-spacing:.12em;white-space:nowrap}.tabs button.on{border-bottom:1px solid var(--fg)}
.tabs b{font-weight:500;margin-left:4px}
.o{border:1px solid var(--line);padding:16px;margin-top:14px;display:grid;gap:12px}
.oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.oh b{font-weight:500;font-size:16px}
.st{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor}
.st.new{color:var(--bad)}.st.packed{color:var(--warn)}.st.shipped,.st.delivered{color:var(--ok)}.st.cancelled,.st.pending{color:var(--mute)}
.blk{background:var(--tone);padding:12px;display:grid;gap:4px}
.blk .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.its div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.its div:last-child{border:0}
.big{font-size:17px;font-weight:400}
.form{display:grid;gap:12px;max-width:420px;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 18px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
@media print{body{padding:0}.no-print,.tabs,.o:not(.pr){display:none!important}.o{border:0}}
</style></head><body>
<h1>Заказы к отправке</h1>
<div id="login" class="form"><label>Пароль<input id="pw" type="password" autocomplete="current-password"></label><div><button class="fill" id="enter">Войти</button></div></div>
<div id="main" hidden>
<div class="row no-print" style="justify-content:space-between;margin-top:6px"><span class="muted" id="who"></span><span class="row"><button id="rf">Обновить</button><button id="out">Выйти</button></span></div>
<div class="tabs no-print" id="tabs"></div>
<div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="on")e.onclick=v;else if(x==="cls")e.className=v;else e.setAttribute(x,v)}for(const c of k)if(c!=null&&c!==false)e.append(c);return e};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2400)};
const rub=n=>Number(n||0).toLocaleString("ru-RU")+" ₽";
const dt=d=>d?new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"";
const ST={new:"Собрать",packed:"Собран, ждёт отправки",shipped:"Отправлен",delivered:"Получен",cancelled:"Отменён",pending:"Не оплачен"};
// Вкладки: что отправить, что уже в пути, завершённые, неоплаченные (на случай звонка покупателя)
const TABS=[["todo","К отправке",o=>o.paid==="paid"&&["new","packed"].includes(o.ship.status)],["way","В пути",o=>o.paid==="paid"&&o.ship.status==="shipped"],["done","Завершённые",o=>["delivered","cancelled"].includes(o.ship.status)||o.paid==="refunded"],["unpaid","Не оплачены",o=>!["paid","refunded"].includes(o.paid)&&o.ship.status!=="cancelled"]];
let KEY="",TAB="todo",L=[];try{KEY=localStorage.getItem("gn_mgr")||""}catch(e){}
async function call(action,data={}){const r=await fetch("/api/manager",{method:"POST",headers:{"Content-Type":"application/json","x-manager-key":KEY},body:JSON.stringify({action,...data})});
const d=await r.json().catch(()=>({error:"Ошибка сервера"}));if(r.status===401){out();throw new Error(d.error)}if(!r.ok)throw new Error(d.error||"Ошибка");return d}
function out(){KEY="";try{localStorage.removeItem("gn_mgr")}catch(e){}$("#main").hidden=true;$("#login").hidden=false}
async function load(){const d=await call("list");L=d.orders;$("#who").textContent="Вы вошли: "+d.by;$("#login").hidden=true;$("#main").hidden=false;render()}
function stOf(o){return o.paid==="paid"||o.ship.status!=="new"?o.ship.status:"pending"}
function where(o){if(o.delivery==="cdek_door")return["Курьер СДЭК до двери",o.city+", "+(o.address||"")];
return[(o.delivery==="cdek_postamat"?"Постамат СДЭК":"Пункт выдачи СДЭК")+(o.pvz?" · код "+o.pvz:""),(o.city||"")+(o.address?", "+o.address:"")]}
function card(o){const st=stOf(o),[dl,ad]=where(o),goods=o.items.filter(i=>i.id!=="delivery"),dlv=o.items.find(i=>i.id==="delivery");
const tr=el("input",{placeholder:"Трек-номер СДЭК",inputmode:"numeric",value:o.ship.track||""});
const nt=el("textarea",{rows:"2",placeholder:"Заметка (видна только вам и администратору)"});nt.value=o.ship.note||"";
const set=(status,btn)=>{btn.disabled=true;call("ship",{id:o.id,status,track:tr.value,note:nt.value}).then(d=>{Object.assign(o,d.order);toast(ST[d.order.ship.status]);render()}).catch(e=>toast(e.message)).finally(()=>btn.disabled=false)};
const acts=el("div",{cls:"row no-print"});const B=(t,s,f)=>{const b=el("button",{cls:f?"fill":""},t);b.onclick=()=>set(s,b);acts.append(b)};
if(o.paid==="paid"){if(o.ship.status==="new")B("Собран","packed",1);if(["new","packed"].includes(o.ship.status))B("Отправлен","shipped",o.ship.status==="packed");
if(o.ship.status==="shipped")B("Получен","delivered",1);if(["packed","shipped","delivered","cancelled"].includes(o.ship.status))B("Вернуть в «К отправке»","new")}
if(o.ship.status!=="cancelled"&&o.ship.status!=="delivered")B("Отменить","cancelled");
const sv=el("button",{},"Сохранить трек и заметку");sv.onclick=()=>set(o.ship.status,sv);acts.append(sv);
const pr=el("button",{},"Печать");pr.onclick=()=>{document.querySelectorAll(".o").forEach(x=>x.classList.remove("pr"));box.classList.add("pr");print()};acts.append(pr);
const box=el("div",{cls:"o"},
el("div",{cls:"oh"},el("b",{},"Заказ "+o.id),el("span",{cls:"st "+st},ST[st])),
el("div",{cls:"muted"},"Оформлен "+dt(o.created)+(o.paidAt?" · оплачен "+dt(o.paidAt):"")+(o.payMethod==="split"?" · Яндекс Сплит":o.paid==="paid"?" · Точка":"")),
el("div",{cls:"blk its"},el("span",{cls:"k"},"Что положить"),...goods.map(i=>el("div",{},el("span",{cls:"big"},i.name),el("span",{},"× "+i.q)))),
el("div",{cls:"blk"},el("span",{cls:"k"},"Кому"),el("span",{cls:"big"},o.name),el("span",{},el("a",{href:"tel:"+o.phone},o.phone)," · ",el("a",{href:"mailto:"+o.email},o.email))),
el("div",{cls:"blk"},el("span",{cls:"k"},"Куда · "+(o.tariff||"СДЭК")),el("span",{cls:"big"},dl),el("span",{},ad)),
el("div",{cls:"muted"},"Товары "+rub(o.total-(dlv?dlv.price:0))+" + доставка "+rub(dlv?dlv.price:0)+" = "+rub(o.total)),
o.paid==="paid"?el("div",{cls:"no-print",style:"display:grid;gap:8px"},tr,nt):null,
o.ship.track?el("div",{},"Трек: ",el("a",{href:"https://www.cdek.ru/ru/tracking?order_id="+encodeURIComponent(o.ship.track),target:"_blank",rel:"noopener"},o.ship.track)):null,
o.ship.by?el("div",{cls:"muted"},"Последнее изменение: "+o.ship.by+", "+dt(o.ship.at)):null,acts);
return box}
function render(){$("#tabs").replaceChildren(...TABS.map(([k,t,f])=>{const n=L.filter(f).length,b=el("button",{cls:k===TAB?"on":""},t,n?el("b",{},n):"");b.onclick=()=>{TAB=k;render()};return b}));
const f=TABS.find(t=>t[0]===TAB)[2],l=L.filter(f);if(TAB==="todo")l.reverse();
$("#list").replaceChildren(...(l.length?l.map(card):[el("p",{cls:"muted",style:"margin-top:20px"},TAB==="todo"?"Всё отправлено. Новые оплаченные заказы появятся здесь.":"Пусто")]))}
$("#enter").onclick=()=>{KEY=$("#pw").value;try{localStorage.setItem("gn_mgr",KEY)}catch(e){}load().catch(e=>toast(e.message))};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#enter").click()};
$("#out").onclick=out;$("#rf").onclick=()=>load().then(()=>toast("Обновлено")).catch(e=>toast(e.message));
if(KEY)load().catch(()=>{});
setInterval(()=>{if(KEY&&!document.hidden&&!document.activeElement.matches("input,textarea"))load().catch(()=>{})},60000);
</script></body></html>
